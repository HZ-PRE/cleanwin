name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and regression tests
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package and validate release artifacts
        shell: pwsh
        run: |
          $options = @{ RequireInstaller = $true }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $options.Version = $env:GITHUB_REF_NAME.Substring(1) }
          ./scripts/publish.ps1 @options

      - name: Upload build artifacts and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanOptimize-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.log
            dist/SHA256SUMS.txt

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Use a version tag such as v0.0.3 or v0.0.3-preview.1.'
          }

      - name: Build and regression tests
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package and validate release artifacts
        shell: pwsh
        run: |
          $options = @{ RequireInstaller = $true }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $options.Version = $env:GITHUB_REF_NAME.Substring(1) }
          ./scripts/publish.ps1 @options

      - name: Upload build artifacts and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanOptimize-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.log
            dist/SHA256SUMS.txt

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      # Expose the release only after all validated assets have finished uploading.
      - name: Publish completed GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = if ($env:GITHUB_REF_NAME.Contains('-')) { '--latest=false' } else { '--latest' }
          gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false $latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the completed release failed.' }

      - name: Explain manual build output
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          'This run creates build artifacts only. Push a version tag (for example v0.0.3) to publish a release discoverable by the app.' >> $env:GITHUB_STEP_SUMMARY
